version: '3.8'

services:
  quotes-website:
    build: .
    ports:
      - "${INTERNAL_PORT}:3001"
    environment:
      - NODE_ENV=production
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - PORT=3001
      - DEV_MODE=${DEV_MODE}
      - PASSWORD=${PASSWORD}
      - DEV_USER_ID=${DEV_USER_ID}
    restart: unless-stopped
    networks:
      - d-nginx_default
    logging:
      driver: gelf
      options:
        syslog-address: "udp://${LOGGING_IP}:1514"
        tag: "afterdark-quotes-website"

networks:
  d-nginx_default:
    external: true
